[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tube-trek"
version = "2.1.0"
description = "Autonomous Agent-Native YouTube Shorts Studio · 100% Free · Zero API Keys"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [
    { name = "Ayush Bhatt", email = "baerozgaarmard@users.noreply.github.com" },
    { name = "Tanisha Gupta" }
]
keywords = ["youtube", "shorts", "ai-video", "agentic", "moviepy", "edge-tts"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Operating System :: OS Independent",
]
dependencies = [
    "requests>=2.31.0",
    "edge-tts>=7.3.1",
    "moviepy==1.0.3",
    "numpy>=1.24.0,<2.0.0",
    "Pillow>=10.0.0",
    "google-api-python-client>=2.100.0",
    "google-auth-oauthlib>=1.1.0",
    "google-auth-httplib2>=0.1.0",
]

[project.scripts]
tube-trek = "make_short:main"

[tool.setuptools]
py-modules = ["make_short", "config"]

[tool.setuptools.packages.find]
where = ["."]
include = ["video*", "uploader*", "agents*", "apis*"]
